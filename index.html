<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:linear-gradient(180deg,#020617,#1e3a8a);min-height:100vh;color:gold;text-align:center}
#topBar{display:flex;justify-content:space-between;background:#020617;color:#facc15;padding:10px 15px;font-size:11px;border-bottom:1px solid gold}

.card{width:88%;max-width:360px;background:rgba(255,255,255,0.08);border:2px solid gold;border-radius:22px;padding:20px;margin:15px auto}
input{width:88%;padding:12px;margin:8px;border-radius:10px;border:1px solid gold;background:rgba(255,255,255,0.12);color:white}
.btn{width:90%;padding:14px;background:linear-gradient(90deg,#facc15,#f59e0b);border:none;border-radius:12px;font-weight:bold;color:#0f172a;margin-top:12px}
#dash{display:none;padding:15px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:15px}
.box{background:#1e293b;border:1px solid gold;padding:14px;border-radius:12px;font-size:13px}

<script>
function tick(){
let d=new Date();
let h=d.getHours()%12||12;
let m=d.getMinutes().toString().padStart(2,'0');
let s=d.getSeconds().toString().padStart(2,'0');
let ap=d.getHours()>=12?'PM':'AM';
let t=h+':'+m+':'+s+' '+ap+' | '+d.toLocaleDateString();
document.getElementById('liveTime').innerText=t;
let dt=document.getElementById('dashTime');
if(dt) dt.innerText=t;
}
setInterval(tick,1000);
tick();
</script>

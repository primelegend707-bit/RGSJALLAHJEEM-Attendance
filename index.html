<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radiant Grammar School Jallah Jeem - QR Attendance</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
body{font-family:'Poppins',sans-serif}
.tab-active{background:#1e40af;color:white}
.qr-card canvas, .qr-card img{margin:auto}
</style>
</head>
<body class="bg-slate-100 min-h-screen">
<header class="bg-blue-800 text-white p-4 text-center shadow-lg">
<h1 class="text-xl md:text-2xl font-bold">Radiant Grammar School Jallah Jeem</h1>
<p class="text-sm opacity-90">Daily Attendance Register - QR System</p>
</header>

<nav class="flex justify-center gap-2 p-3 bg-white shadow sticky top-0 z-10">
<button onclick="showTab('students')" id="btn-students" class="tab-active px-4 py-2 rounded-lg font-semibold text-sm">Students</button>
<button onclick="showTab('scan')" id="btn-scan" class="bg-slate-200 px-4 py-2 rounded-lg font-semibold text-sm">Scan QR</button>
<button onclick="showTab('report')" id="btn-report" class="bg-slate-200 px-4 py-2 rounded-lg font-semibold text-sm">Report</button>
</nav>

<div id="tab-students" class="p-3 max-w-3xl mx-auto">
  <div class="bg-white rounded-xl shadow p-4 mb-4">
    <h2 class="font-bold mb-3">Add New Student</h2>
    <div class="grid gap-2">
      <input id="roll" placeholder="Roll / ID e.g. RGS-1001" class="border rounded-lg p-2.5 text-sm">
      <input id="name" placeholder="Student Name" class="border rounded-lg p-2.5 text-sm">
      <input id="father" placeholder="Father Name" class="border rounded-lg p-2.5 text-sm">
      <select id="class" class="border rounded-lg p-2.5 text-sm">
        <option>Play Group to KG</option><option>Nursery</option><option>KG</option><option>Class 1</option><option>Class 2</option><option>Class 3</option><option>Class 4</option><option>Class 5</option><option>Class 6</option><option>Class 7</option><option>Class 8</option><option>Class 9</option><option>Class 10</option>
      </select>
      <button onclick="addStudent()" class="bg-blue-800 text-white rounded-lg py-2.5 font-semibold">Add Student</button>
      <button onclick="addSample()" class="bg-green-600 text-white rounded-lg py-2 text-sm">Add 3 Sample Students</button>
    </div>
  </div>
  <div id="studentList" class="grid gap-3"></div>
</div>

<div id="tab-scan" class="p-3 max-w-3xl mx-auto hidden">
  <div class="bg-white rounded-xl shadow p-4 mb-3">
    <h2 class="font-bold mb-2">Scan Student QR for Attendance</h2>
    <div id="reader" class="w-full rounded-lg overflow-hidden border"></div>
    <div class="flex gap-2 mt-3">
      <button onclick="startScan()" id="startBtn" class="bg-blue-800 text-white px-4 py-2 rounded-lg flex-1 font-semibold">Start Camera</button>
      <button onclick="stopScan()" class="bg-red-600 text-white px-4 py-2 rounded-lg flex-1 font-semibold">Stop</button>
    </div>
    <div class="mt-3 flex gap-2">
      <input id="manualRoll" placeholder="Manual Roll e.g. RGS-1001" class="border rounded-lg p-2.5 text-sm flex-1">
      <button onclick="manualAttendance()" class="bg-slate-800 text-white px-4 rounded-lg text-sm">Mark Present</button>
    </div>
    <p id="scanResult" class="mt-3 text-center font-bold text-green-700"></p>
  </div>
  <div class="bg-white rounded-xl shadow p-4">
    <h3 class="font-bold text-sm mb-2">Today's Present (<span id="todayDate"></span>)</h3>
    <div id="todayList" class="text-sm"></div>
  </div>
</div>

<div id="tab-report" class="p-3 max-w-3xl mx-auto hidden">
  <div class="bg-white rounded-xl shadow p-4">
    <h2 class="font-bold mb-3">Attendance Report</h2>
    <div class="flex gap-2 mb-3">
      <input type="date" id="reportDate" class="border rounded-lg p-2 text-sm" onchange="renderReport()">
      <button onclick="exportCSV()" class="bg-green-600 text-white px-3 py-2 rounded-lg text-sm">Export CSV</button>
      <button onclick="clearAttendance()" class="bg-red-100 text-red-700 px-3 py-2 rounded-lg text-sm">Clear</button>
    </div>
    <div id="reportList" class="text-sm"></div>
  </div>
</div>

<script>
let students = JSON.parse(localStorage.getItem('rgs_students')||'[]');
let attendance = JSON.parse(localStorage.getItem('rgs_attendance')||'{}');
let html5Qrcode;
function save(){localStorage.setItem('rgs_students',JSON.stringify(students));localStorage.setItem('rgs_attendance',JSON.stringify(attendance));}
function todayStr(){return new Date().toISOString().split('T')[0];}
document.getElementById('todayDate').innerText=todayStr();
document.getElementById('reportDate').value=todayStr();
function showTab(t){
document.getElementById('tab-students').classList.add('hidden');
document.getElementById('tab-scan').classList.add('hidden');
document.getElementById('tab-report').classList.add('hidden');
document.getElementById('tab-'+t).classList.remove('hidden');
document.getElementById('btn-students').className='bg-slate-200 px-4 py-2 rounded-lg font-semibold text-sm';
document.getElementById('btn-scan').className='bg-slate-200 px-4 py-2 rounded-lg font-semibold text-sm';
document.getElementById('btn-report').className='bg-slate-200 px-4 py-2 rounded-lg font-semibold text-sm';
document.getElementById('btn-'+t).className='tab-active px-4 py-2 rounded-lg font-semibold text-sm';
if(t==='report')renderReport();if(t==='scan')renderToday();
}
function addStudent(){
const roll=document.getElementById('roll').value.trim().toUpperCase();
const name=document.getElementById('name').value.trim();
const father=document.getElementById('father').value.trim();
const cls=document.getElementById('class').value;
if(!roll||!name){alert('Roll and Name required');return;}
if(students.find(s=>s.roll===roll)){alert('Roll already exists');return;}
students.push({roll,name,father,cls});save();renderStudents();
document.getElementById('roll').value='';document.getElementById('name').value='';document.getElementById('father').value='';
}
function addSample(){
const samples=[{roll:'RGS-1001',name:'Ali Raza',father:'Muhammad Riaz',cls:'Class 3'},{roll:'RGS-1002',name:'Ayesha Khan',father:'Khan Muhammad',cls:'Class 2'},{roll:'RGS-1003',name:'Usman Jutt',father:'Bilal Jutt',cls:'Play Group to KG'}];
samples.forEach(s=>{if(!students.find(x=>x.roll===s.roll))students.push(s);});save();renderStudents();
}
function deleteStudent(roll){if(!confirm('Delete '+roll+' ?'))return;students=students.filter(s=>s.roll!==roll);save();renderStudents();}
function renderStudents(){
const div=document.getElementById('studentList');
if(students.length===0){div.innerHTML='<p class="text-center text-sm text-slate-500">No students yet. Add students.</p>';return;}
div.innerHTML='';
students.forEach((s,i)=>{
const card=document.createElement('div');
card.className='bg-white rounded-xl shadow p-3 flex gap-3 items-center';
card.innerHTML=`<div class="flex-1"><p class="font-bold text-sm">${s.roll} - ${s.name}</p><p class="text-xs text-slate-600">Father: ${s.father} | ${s.cls}</p><div class="flex gap-2 mt-2"><button onclick="showQR('${s.roll}')" class="bg-slate-800 text-white px-3 py-1 rounded text-xs">View QR</button><button onclick="deleteStudent('${s.roll}')" class="bg-red-100 text-red-600 px-3 py-1 rounded text-xs">Delete</button></div></div><div id="qr-${i}" class="qr-card w-20 h-20"></div>`;
div.appendChild(card);
setTimeout(()=>{const el=document.getElementById(`qr-${i}`);if(el){el.innerHTML='';new QRCode(el,{text:s.roll,width:80,height:80});}},100);
});
}
function showQR(roll){
const s=students.find(x=>x.roll===roll);
const w=window.open('','_blank','width=400,height=500');
w.document.write(`<html><head><title>${roll}</title></head><body style="text-align:center;font-family:sans-serif"><h2>${s.name}</h2><p>${roll} | ${s.cls}</p><div id="q"></div><p>Father: ${s.father}</p><p>Radiant Grammar School Jallah Jeem</p><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"><\/script><script>new QRCode(document.getElementById("q"),{text:"${roll}",width:200,height:200});window.print();<\/script></body></html>`);
}
function markAttendance(roll){
const s=students.find(x=>x.roll===roll);
if(!s){document.getElementById('scanResult').innerText='❌ Student not found: '+roll;return false;}
const date=todayStr();
if(!attendance[date])attendance[date]=[];
if(attendance[date].find(a=>a.roll===roll)){document.getElementById('scanResult').innerText='⚠️ Already Present: '+s.name;return true;}
attendance[date].push({roll,time:new Date().toLocaleTimeString()});save();
document.getElementById('scanResult').innerText='✅ Present: '+s.name+' ('+roll+') at '+new Date().toLocaleTimeString();
renderToday();renderReport();if(navigator.vibrate)navigator.vibrate(200);return true;
}
function manualAttendance(){const roll=document.getElementById('manualRoll').value.trim().toUpperCase();if(!roll)return;markAttendance(roll);document.getElementById('manualRoll').value='';}
function startScan(){
if(html5Qrcode&&html5Qrcode.isScanning)return;
html5Qrcode=new Html5Qrcode("reader");
html5Qrcode.start({facingMode:"environment"},{fps:10,qrbox:250},(decoded)=>{markAttendance(decoded.trim().toUpperCase());},(err)=>{}).catch(e=>{alert('Camera error: '+e);});
}
function stopScan(){if(html5Qrcode){html5Qrcode.stop().then(()=>{document.getElementById('reader').innerHTML='';}).catch(()=>{});}}
function renderToday(){
const date=todayStr();const list=attendance[date]||[];
document.getElementById('todayList').innerHTML=list.length?list.map(a=>{const s=students.find(x=>x.roll===a.roll);return `<div class="flex justify-between border-b py-1"><span>${a.roll} - ${s?s.name:'Unknown'}</span><span>${a.time}</span></div>`;}).join(''):'<p class="text-slate-500">No attendance yet today.</p>';
}
function renderReport(){
const date=document.getElementById('reportDate').value||todayStr();const list=attendance[date]||[];let presentRolls=list.map(a=>a.roll);let absent=students.filter(s=>!presentRolls.includes(s.roll));
let html=`<p class="mb-2 font-semibold">Date: ${date} | Present: ${list.length} | Absent: ${absent.length} | Total: ${students.length}</p>`;
html+=`<div class="mb-3"><b>Present:</b><br>`+(list.map(a=>{const s=students.find(x=>x.roll===a.roll);return `${a.roll} - ${s?s.name:''} (${a.time})`;}).join('<br>')||'None')+`</div>`;
html+=`<div><b>Absent:</b><br>`+(absent.map(s=>`${s.roll} - ${s.name}`).join('<br>')||'None')+`</div>`;
document.getElementById('reportList').innerHTML=html;
}
function exportCSV(){
const date=document.getElementById('reportDate').value||todayStr();const list=attendance[date]||[];let csv='Roll,Name,Father,Class,Status,Time,Date\n';
students.forEach(s=>{const att=list.find(a=>a.roll===s.roll);csv+=`${s.roll},"${s.name}","${s.father}",${s.cls},${att?'Present':'Absent'},${att?att.time:''},${date}\n`;});
const blob=new Blob([csv],{type:'text/csv'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`Attendance_${date}.csv`;a.click();
}
function clearAttendance(){const date=document.getElementById('reportDate').value;if(!confirm('Clear attendance for '+date+' ?'))return;delete attendance[date];save();renderReport();renderToday();}
renderStudents();renderToday();renderReport();
</script>
</body>
                                                                        </html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RGS - Made by Mian Ahmad</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:#0a0e23;min-height:100vh}
.login-page{height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(120% 120% at 20% 10%,#1a1740 0%,#0a0e23 45%,#0a1931 100%);position:relative;overflow:hidden;padding:18px;flex-direction:column}
.blob{position:absolute;border-radius:50%;filter:blur(32px);opacity:.9}
.b1{width:220px;height:220px;background:radial-gradient(circle,#e0c88a 0%,#C5A059 40%,transparent 70%);top:-20px;left:-30px;animation:float 6s ease-in-out infinite}
.b2{width:180px;height:160px;background:radial-gradient(circle,#c9ab6a 0%,transparent 70%);top:18%;right:8%;animation:float 7s ease-in-out infinite reverse}
.b3{width:200px;height:200px;background:radial-gradient(circle,#C5A059 0%,transparent 70%);bottom:5%;right:-20px;animation:float 8s ease-in-out infinite}
.b4{width:140px;height:140px;background:radial-gradient(circle,#e0c88a 0%,transparent 70%);bottom:22%;left:10%;animation:float 6.5s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-18px) scale(1.05)}}
.glass-card{position:relative;z-index:2;width:100%;max-width:360px;background:linear-gradient(180deg,rgba(255,255,255,.08) 0%,rgba(255,255,255,.03) 100%);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border:1.5px solid rgba(224,200,138,.5);border-radius:32px;padding:30px 22px;box-shadow:0 0 0 1px rgba(197,160,89,.2),0 20px 60px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.15)}
.top-icon{width:52px;height:52px;margin:0 auto 18px;background:linear-gradient(135deg,#e0c88a,#C5A059);border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:26px}
.title{font-size:30px;font-weight:800;color:#fff;text-align:center;letter-spacing:-.8px}
.subtitle{font-size:13px;color:#a9a6c8;text-align:center;margin:8px 0 22px}
.label{font-size:12px;color:#e0c88a;font-weight:600;text-align:center;margin:18px 0 8px}
.input-glass{width:100%;padding:15px 16px 15px 46px;border-radius:18px;border:1.2px solid rgba(224,200,138,.35);background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.06));color:#fff;font-size:14px;font-weight:600;outline:none}
.wrap{position:relative}
.wrap .ico{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:18px;color:#e0c88a}
.wrap .eye{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:16px;color:#e0c88a;cursor:pointer}
.btn-gold{width:100%;margin-top:26px;padding:16px;border-radius:28px;border:none;background:linear-gradient(90deg,#e0c88a 0%,#C5A059 100%);color:#1a1400;font-size:17px;font-weight:800;box-shadow:0 12px 24px rgba(197,160,89,.35);cursor:pointer}
.made{margin-top:28px;text-align:center;font-size:12px;color:#c9b896;position:relative;z-index:2;font-weight:500}
.phone-wrap{max-width:420px;margin:0 auto;background:#122149;min-height:100vh;position:relative;padding-bottom:80px}
.top-header{background:#0a1931;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(197,160,89,.3)}
.logo{display:flex;align-items:center;gap:10px}
.logo-icon{width:38px;height:38px;background:linear-gradient(135deg,#C5A059,#e0c88a);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;color:#0a1931;font-weight:800}
.logo-text h1{font-size:15px;color:#e0c88a;font-weight:800}
.premium-pill{text-align:center;margin:10px 16px}
.premium-pill span{border:1px solid #C5A059;color:#C5A059;padding:4px 14px;border-radius:20px;font-size:11px}
.dashboard-card{background:#0a1931;margin:10px 16px;border-radius:14px;padding:14px;border:1px solid rgba(197,160,89,.25)}
.dashboard-card h2{text-align:center;color:#e0c88a;font-size:22px;font-weight:800}
.stats-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:12px 16px}
.stat-gold{background:linear-gradient(135deg,#C5A059,#d9b77a);border-radius:12px;padding:10px 6px;text-align:center;color:#0a1931;border:1px solid #e0c88a}
.fee-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 16px 12px}
.fee-dark{background:#0a1931;border-radius:12px;padding:12px;text-align:center;border:1px solid rgba(197,160,89,.25)}
.search-box{margin:0 16px 14px;position:relative}
.search-box input{width:100%;padding:12px 12px 12px 40px;border-radius:12px;border:1.5px solid #C5A059;background:#0a1931;color:#e0c88a;font-size:13px;outline:none}
.search-box .sicon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#C5A059}
.section-head{display:flex;justify-content:space-between;align-items:center;margin:0 16px 8px}
.class-dropdown{background:#e0c88a;color:#0a1931;padding:5px 10px;border-radius:20px;font-size:11px;font-weight:700;border:none}
.student-card{background:#fff;margin:0 16px 8px;border-radius:12px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;color:#0a1931}
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:420px;background:#0a1931;border-top:2px solid #C5A059;display:flex;justify-content:space-around;padding:8px 0;z-index:20}
.bottom-nav button{background:none;border:none;color:#8da0c5;font-size:10px;padding:6px 12px;border-radius:20px}
.bottom-nav button.active{background:#C5A059;color:#0a1931;font-weight:800}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal.open{display:flex}
.modal-box{background:#fff;width:100%;max-width:400px;border-radius:16px;padding:16px;color:#0a1931;border:3px solid #C5A059;max-height:90vh;overflow-y:auto}
.hidden{display:none!important}
.input{width:100%;padding:11px;border:2px solid #ddd;border-radius:10px;margin:6px 0;font-size:13px}
.btn{width:100%;padding:11px;border-radius:10px;font-weight:800;border:none;cursor:pointer;margin-top:6px}
.btn-navy{background:#0a1931;color:#C5A059} .btn-gold{background:#C5A059;color:#0a1931}
.action-btn{background:linear-gradient(135deg,#C5A059,#d9b77a);color:#0a1931;border:none;padding:8px;border-radius:8px;font-size:10px;font-weight:700;display:flex;align-items:center;gap:5px;justify-content:center;cursor:pointer}
</style>
</head>
<body>
<div id=loginPage class=login-page>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="blob b4"></div>
<div class=glass-card>
<div class=top-icon>🎓</div>
<div class=title>Welcome Back</div>
<div class=subtitle>Sign in to continue</div>
<div class=label>Username</div>
<div class=wrap><span class=ico>👤</span><input id=userInput class=input-glass type=text placeholder="RGSJALLAHJEEM"></div>
<div class=label>Password</div>
<div class=wrap><span class=ico>🔒</span><input id=passInput class=input-glass type=password placeholder="••••••"><span class=eye onclick="let i=document.getElementById('passInput');i.type=i.type==='password'?'text':'password'">👁️</span></div>
<button class=btn-gold onclick=login()>Login</button>
</div>
<div class=made>Made by Mian Ahmad</div>
</div>

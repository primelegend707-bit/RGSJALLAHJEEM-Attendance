<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RGS JALLAH JEEM - Fee Management</title>
<link rel="icon" href="logo.png">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#0f172a;color:#fff;min-height:100vh;position:relative}
#loginPage{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.login-box{background:#1e293b;padding:30px;border-radius:20px;width:100%;max-width:380px;text-align:center}
.login-logo{width:110px;height:110px;margin:0 auto 12px;background:#fff;border-radius:50%;padding:6px}
.login-logo img{width:100%;height:100%;object-fit:contain;border-radius:50%}
.login-box h2{color:#d9b88a;margin-bottom:4px}
.login-box input{width:100%;padding:14px;border-radius:12px;border:1px solid #334155;background:#0f172a;color:#fff;margin-bottom:12px;font-size:16px;text-align:left}
.login-box button{width:100%;padding:14px;border-radius:12px;border:none;background:#d9b88a;color:#0f172a;font-weight:800;font-size:16px;cursor:pointer}
#mainApp{display:none;position:relative;min-height:100vh}
#mainApp::before{
 content:"";
 position:fixed;
 top:50%;left:50%;
 transform:translate(-50%,-50%);
 width:80vw;max-width:450px;height:80vw;max-height:450px;
 background-image:url('logo.png');
 background-size:contain;background-repeat:no-repeat;background-position:center;
 opacity:0.07;pointer-events:none;z-index:0;
}
.header{padding:12px 16px;display:flex;justify-content:space-between;align-items:center;background:#1e293b;position:relative;z-index:1}
.header-left{display:flex;align-items:center;gap:10px}
.header-logo{width:38px;height:38px;background:#fff;border-radius:50%;padding:2px}
.header-logo img{width:100%;height:100%;object-fit:contain;border-radius:50%}
.tab{display:none;padding:16px;padding-bottom:80px;position:relative;z-index:1}
.tab.active{display:block}
.card{background:rgba(30,41,59,0.96);border-radius:16px;padding:14px;margin-bottom:12px}
.btn{background:#d9b88a;color:#0f172a;border:none;padding:12px 20px;border-radius:12px;font-weight:700;cursor:pointer}
.inp{width:100%;padding:12px;border-radius:10px;border:1px solid #334155;background:#0f172a;color:#fff;margin-bottom:10px;font-size:15px}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#1e293b;display:flex;justify-content:space-around;padding:10px 0;border-top:1px solid #334155;z-index:10}
.bottom-nav button{background:none;border:none;color:#94a3b8;padding:8px 16px;border-radius:20px;font-size:13px}
.bottom-nav button.active{background:#d9b88a;color:#0f172a;font-weight:700}
.top-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:16px}
.stat{background:#d9b88a;color:#0f172a;border-radius:16px;padding:12px;text-align:center}
.stat b{font-size:20px;display:block}
.fab{position:fixed;bottom:80px;right:20px;width:56px;height:56px;border-radius:50%;background:#d9b88a;color:#0f172a;border:none;font-size:28px;font-weight:800;cursor:pointer;z-index:10}
</style>
</head>
<body>
<div id="loginPage">
<div class="login-box">
<div class="login-logo"><img src="logo.png"></div>

<p style="margin:8px 0;color:#94a3b8;font-size:13px">RADIANT GRAMMAR SCHOOL<br>Iman • Ittehad • Nazm</p>
<p style="text-align:center;margin:10px 0;color:#d9b88a;font-size:12px;background:rgba(217,184,138,.1);padding:6px;border-radius:8px">Secure Login - Har Dafa Password</p>
<input id="u" placeholder="Username">
<input id="p" type="password" placeholder="Password">
<button onclick="doLogin()">Login</button>
<p id="err" style="color:#f87171;margin-top:10px;display:none;text-align:center"></p>
</div>
</div>
<div id="mainApp">
<div class="header">
<div class="header-left">
<div class="header-logo"><img src="logo.png"></div>
<h3 style="color:#d9b88a;font-size:14px">RGS JALLAH JEEM</h3>
</div>
<div style="display:flex;gap:8px">
<select id="yearSel" onchange="render()" style="background:#d9b88a;color:#0f172a;border:none;padding:6px 10px;border-radius:20px;font-weight:700"><option>2026</option><option>2027</option><option>2028</option><option>2029</option><option>2030</option></select>
<button onclick="doLogout()" style="background:#334155;color:#fff;border:none;padding:6px 12px;border-radius:20px;font-size:12px">Logout</button>
</div>
</div>
<div id="tab-dashboard" class="tab active">
<div class="top-stats">
<div class="stat"><span>Total</span><b id="tTotal">0</b></div>
<div class="stat"><span>Paid</span><b id="tPaid">0</b></div>
<div class="stat"><span>Unpaid</span><b id="tUnpaid">0</b></div>
</div>
<div class="card"><input id="search" class="inp" placeholder="Naam / Wald / B-Form..." oninput="render()"></div>
<div id="dashList"></div>
</div>
<div id="tab-students" class="tab">
<div class="card"><h4>Add Student</h4>
<input id="sName" class="inp" placeholder="Bachy ka Naam">

<input id="sBform" class="inp" placeholder="B-Form Number">
<input id="sClass" class="inp" placeholder="Class">
<button class="btn" onclick="addStudent()" style="width:100%">Save</button>
</div>
<div id="studentList"></div>
</div>
<div id="tab-fees" class="tab"><div id="feeList"></div></div>
<div id="tab-reports" class="tab"><div class="card"><h4>Reports</h4><p id="reportText"></p></div></div>
<div id="tab-settings" class="tab">
<div class="card">
<div style="text-align:center"><img src="logo.png" style="width:80px;height:80px;background:#fff;border-radius:50%;padding:4px"><h4 style="margin-top:8px">RGS JALLAH JEEM</h4><p style="color:#d9b88a;font-size:12px">Iman • Ittehad • Nazm</p></div>
<p style="margin:10px 0;color:#94a3b8;font-size:13px">Secure Login - Har dafa password lagega, Privacy mehfooz</p>
<button class="btn" onclick="doLogout()" style="width:100%;background:#f87171;color:#fff">🔒 Logout</button>
</div>
</div>
<button class="fab" onclick="openTab('students')">+</button>
<div class="bottom-nav">
<button id="b-dashboard" class="active" onclick="openTab('dashboard')">Dashboard</button>
<button id="b-students" onclick="openTab('students')">Students</button>
<button id="b-fees" onclick="openTab('fees')">Fees</button>
<button id="b-reports" onclick="openTab('reports')">Reports</button>
<button id="b-settings" onclick="openTab('settings')">Settings</button>
</div>
</div>
<script>
let students=JSON.parse(localStorage.getItem('rgs_students')||'[]');
let fees=JSON.parse(localStorage.getItem('rgs_fees')||'[]');
function doLogin(){
 let u=document.getElementById('u').value.trim();

   document.getElementById('loginPage').style.display='none';
   document.getElementById('mainApp').style.display='block';
   document.getElementById('u').value='';document.getElementById('p').value='';
   render();
 } else {
   let e=document.getElementById('err');e.style.display='block';e.innerText='Ghalat Username ya Password!';
 }
}
function doLogout(){
 document.getElementById('mainApp').style.display='none';
 document.getElementById('loginPage').style.display='flex';
}
function openTab(t){
 document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));

 document.getElementById('tab-'+t).classList.add('active');
 document.getElementById('b-'+t).classList.add('active');
 render();
}

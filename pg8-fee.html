<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RGS - Final Complete - Private</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
body{font-family:Arial;background:#f0f0f0;padding:10px}
.box{max-width:480px;margin:0 auto;background:#fff;border:1.5px solid #000;padding:15px;border-radius:12px}
.center{text-align:center}
label{font-size:11px;font-weight:bold;display:block;margin-top:6px}
input,select{width:100%;padding:8px;border:1px solid #000;border-radius:5px;box-sizing:border-box;margin-top:3px}
.flex{display:flex;gap:6px} .flex div{flex:1}
.months{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin:5px 0}
.month-item{border:1px solid #000;padding:4px;border-radius:4px;font-size:11px;display:flex;align-items:center;gap:4px}
.month-item input{width:auto}
.btn{width:100%;padding:11px;margin-top:7px;border:0;border-radius:6px;font-weight:bold;color:#fff;cursor:pointer}
.btn-black{background:#000}.btn-green{background:#198754}.btn-blue{background:#0d6efd}
.section{background:#000;color:#fff;padding:5px 8px;font-size:11px;border-radius:4px;margin:12px 0 5px 0}
.history{border:1px solid #000;border-radius:8px;padding:8px;margin-top:8px;max-height:350px;overflow:auto}
.hist-item{border-bottom:1px dashed #000;padding:6px 0;font-size:11px}
.search-box{background:#e9ecef;padding:10px;border-radius:8px;margin:10px 0}
.preview{background:#000;color:#fff;padding:8px;border-radius:6px;margin:8px 0;border-left:4px solid #d4af37}
</style>
</head>
<body>
<div class="box">
<div class="center"><h3 style="margin:0">RGS JALLAH JEEM</h3><small>PRIVATE SCHOOL | 0307-8134467</small></div>
<div class="preview">
<div style="font-weight:bold" id="pName">Student: -</div>
<div style="color:#d4af37;font-size:12px" id="pFather">والد: - | Class: -</div>
</div>
<div class="section">B.FORM DATA</div>
<input id="sName" placeholder="Bache ka Name" oninput="updatePreview()">
<div class="flex"><div><input type="date" id="dob"></div><div><select id="sex"><option>Male</option><option>Female</option></select></div></div>
<input id="fName" placeholder="Father Name / Father ID Card" oninput="updatePreview()">
<input id="idCard" placeholder="B.Form / ID No - 35202-xxxxxxx">
<input id="address" placeholder="Address - Mukammal Pata">
<input id="className" placeholder="Class" oninput="updatePreview()">
<div class="section">FEE - DISCOUNT & STATUS</div>
<div class="flex"><div><label>Admission Fee</label><input type="number" id="admFee" value="5000"></div><div><label>Disc</label><input type="number" id="admDisc" value="0"></div></div>
<div class="flex"><div><label>Yearly Fund</label><input type="number" id="yearFund" value="2000"></div><div><label>Disc</label><input type="number" id="yearDisc" value="0"></div></div>
<label>Yearly Fund Status</label>
<select id="fundStatus"><option value="PAID">PAID</option><option value="NO PAID" selected>NO PAID - Rehta Hai</option></select>
<div class="section">MULTI MONTH FEE</div>
<label>Per Month Fee</label><input type="number" id="perMonth" value="1000">
<label>Select Pending Months</label>
<div class="months" id="monthBox"></div>
<div class="flex"><div><label>Monthly Disc Total</label><input type="number" id="monDisc" value="0"></div><div><label>Issued By</label><input id="issuedBy" placeholder="Admin"></div></div>
<button class="btn btn-black" onclick="saveAndPDF()">💾 Save + PDF Download</button>
<div class="section">🔍 HISTORY SEARCH</div>
<div class="search-box">
<input id="searchInput" placeholder="Search Name, Father, Date, Month..." oninput="showHistory()">
<div class="flex" style="margin-top:6px"><div><input type="month" id="monthFilter" onchange="showHistory()"></div><div><button class="btn btn-blue" style="margin:0;padding:8px" onclick="showHistory()">Search</button></div></div>
</div>
<div class="history" id="historyList"></div>
<button class="btn btn-green" onclick="clearHistory()">🗑️ Clear History</button>
</div>
<script>
const monthsList=["Jan 2024","Feb 2024","Mar 2024","Apr 2024","May 2024","Jun 2024","Jul 2024","Aug 2024","Sep 2024","Oct 2024","Nov 2024","Dec 2024","Jan 2025","Feb 2025","Mar 2025","Apr 2025","May 2025","Jun 2025","Jul 2025","Aug 2025","Sep 2025","Oct 2025","Nov 2025","Dec 2025"];
const box=document.getElementById('monthBox');
monthsList.forEach((m,i)=>{let chk=(i>=7&&i<=10)?"checked":"";box.innerHTML+=`<div class="month-item"><input type="checkbox" value="${m}" ${chk} class="mcheck"> ${m}</div>`;});
function updatePreview(){let s=document.getElementById('sName').value||"-";let f=document.getElementById('fName').value||"-";let c=document.getElementById('className').value||"-";document.getElementById('pName').innerText="Student: "+s;document.getElementById('pFather').innerText="والد: "+f+" | Class: "+c;}
function getData(){let checks=document.querySelectorAll('.mcheck:checked');let sel=[];checks.forEach(c=>sel.push(c.value));return{id:Date.now(),date:new Date().toLocaleString(),dateOnly:new Date().toISOString().split('T')[0],sName:document.getElementById('sName').value||"-",className:document.getElementById('className').value||"-",fName:document.getElementById('fName').value||"-",idCard:document.getElementById('idCard').value,address:document.getElementById('address').value,dob:document.getElementById('dob').value,sex:document.getElementById('sex').value,admFee:parseInt(document.getElementById('admFee').value)||0,admDisc:parseInt(document.getElementById('admDisc').value)||0,yearFund:parseInt(document.getElementById('yearFund').value)||0,yearDisc:parseInt(document.getElementById('yearDisc').value)||0,fundStatus:document.getElementById('fundStatus').value,perMonth:parseInt(document.getElementById('perMonth').value)||0,months:sel,monthsCount:sel.length,monDisc:parseInt(document.getElementById('monDisc').value)||0,issuedBy:document.getElementById('issuedBy').value||"Admin"};}
function saveAndPDF(){let d=getData();let netAdm=d.admFee-d.admDisc;let netYear=d.yearFund-d.yearDisc;let monthsTotal=d.monthsCount*d.perMonth;let monthsNet=monthsTotal-d.monDisc;let grand=netAdm+monthsNet;if(d.fundStatus==="PAID")grand+=netYear;d.grandTotal=grand;let hist=JSON.parse(localStorage.getItem('rgs_hist')||"[]");hist.unshift(d);localStorage.setItem('rgs_hist',JSON.stringify(hist));showHistory();const{jsPDF}=window.jspdf;const doc=new jsPDF({unit:'mm',format:[80,280]});let y=8;doc.setFontSize(10);doc.setFont("helvetica","bold");doc.text("RGS JALLAH JEEM PRIVATE SCHOOL",40,y,{align:"center"});y+=4;doc.setFontSize(8);doc.setFont("helvetica","normal");doc.text("Phone 0307-8134467",40,y,{align:"center"});y+=5;doc.text("----------------------------",40,y,{align:"center"});y+=5;doc.setFontSize(9);doc.setFont("helvetica","bold");doc.text("FEE RECEIPT",40,y,{align:"center"});y+=5;doc.setFontSize(7);doc.setFont("helvetica","normal");doc.text("Date: "+d.date,3,y);y+=4;doc.text("Student: "+d.sName,3,y);y+=4;doc.text("Father: "+d.fName+" | Class: "+d.className,3,y);y+=5;doc.text("----------------------------",40,y,{align:"center"});y+=5;doc.text("Adm: "+d.admFee+" -Disc "+d.admDisc+" = "+netAdm+" PKR",3,y);y+=4;doc.text("Yearly: "+netYear+" PKR | Status: "+d.fundStatus,3,y);y+=5;doc.setFont("helvetica","bold");doc.text("MONTHS:",3,y);y+=4;doc.setFont("helvetica","normal");d.months.forEach(m=>{doc.text(m+" - "+d.perMonth+" PKR",3,y);y+=4;});doc.text("Disc: -"+d.monDisc+" | Net: "+monthsNet+" PKR",3,y);y+=5;doc.text("----------------------------",40,y,{align:"center"});y+=5;doc.setFont("helvetica","bold");doc.setFontSize(10);doc.text("GRAND TOTAL: "+grand+" PKR",3,y);y+=6;doc.setFontSize(7);doc.setFont("helvetica","normal");doc.text("Issued By: "+d.issuedBy,3,y);y+=6;doc.text("Thank You! - RGS Private",40,y,{align:"center"});doc.save("RGS-"+d.sName+"-"+d.dateOnly+".pdf");}
function showHistory(){let hist=JSON.parse(localStorage.getItem('rgs_hist')||"[]");let q=document.getElementById('searchInput').value.toLowerCase();let mf=document.getElementById('monthFilter').value;let html="";let filtered=hist.filter(h=>{let matchQ=!q||(h.sName.toLowerCase().includes(q)||h.className.toLowerCase().includes(q)||h.date.toLowerCase().includes(q)||h.months.join(',').toLowerCase().includes(q)||h.fName.toLowerCase().includes(q));let matchM=!mf||h.dateOnly.startsWith(mf);return matchQ&&matchM;});if(filtered.length==0)html="<div style='text-align:center;color:#888'>No record</div>";filtered.forEach(h=>{html+=`<div class="hist-item"><b>${h.sName}</b> | <span style="color:green">والد: ${h.fName}</span> | ${h.className} | ${h.dateOnly}<br>B.Form: ${h.idCard||'-'} | DOB: ${h.dob||'-'} | ${h.sex||''}<br>Months: ${h.months.join(', ')} | Grand: ${h.grandTotal} PKR</div>`;});document.getElementById('historyList').innerHTML=html;}
function clearHistory(){if(confirm("Delete?")){localStorage.removeItem('rgs_hist');showHistory();}}
showHistory();
</script>
</body>
</html>

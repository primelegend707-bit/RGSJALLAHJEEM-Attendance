<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RGS - Made by Mian Ahmad</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;font-family:Inter,system-ui}
body{margin:0;min-height:100vh;background:#0f172a;display:flex;justify-content:center;align-items:center}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:0.6}
.login-page{width:100%;max-width:400px;padding:20px}
.glass-card{background:rgba(255,255,255,0.08);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.18);padding:30px;border-radius:20px;text-align:center}
.logo-icon{width:60px;height:60px;background:linear-gradient(135deg,#fde68a,#f59e0b);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 15px;font-size:30px}
.title{font-size:30px;font-weight:800;color:#fff}
.input{width:100%;padding:14px 15px;margin:8px 0;border-radius:12px;border:1px solid rgba(255,255,255,0.3);background:rgba(0,0,0,0.3);color:#fff;font-size:15px}
.btn-gold{width:100%;padding:14px;background:#fde68a;color:#000;font-weight:700;border:none;border-radius:12px;font-size:18px;cursor:pointer;margin-top:10px}
.made{margin-top:15px;font-size:12px;opacity:0.6;color:#fff}
#mainApp{display:none;width:95%;max-width:1100px;padding:20px;color:#fff;align-self:flex-start}
table{width:100%;border-collapse:collapse;margin-top:15px;background:rgba(255,255,255,0.05)}
th,td{padding:10px;border-bottom:1px solid rgba(255,255,255,0.1);text-align:left}
.bform{background:#38bdf8;color:#000;padding:5px 10px;border-radius:8px;font-size:12px}
</style>
</head>
<body>
<div id="loginPage" class="login-page">
<div class="glass-card">
<div class="logo-icon">🎓</div>
<div class="title">Welcome Back</div>
<div style="color:#94a3b8;margin-bottom:20px">Sign in to continue</div>
<input id="userInput" class="input" type="text" value="RGSJALLAHJEEM" placeholder="Username">
<div style="position:relative">
<input id="passInput" class="input" type="password" value="RGJ123" placeholder="Password">
<span onclick="let i=document.getElementById('passInput');i.type=i.type==='password'?'text':'password'" style="position:absolute;right:15px;top:50%;transform:translateY(-50%);cursor:pointer">👁️</span>
</div>
<div id="errMsg" style="color:#fca5a5;display:none;margin-top:8px;font-size:13px"></div>
<button id="loginBtn" class="btn-gold">Login</button>
<div class="made">Made by Mian Ahmad<br>Username: RGSJALLAHJEEM | Password: RGJ123</div>
</div>
</div>

<div id="mainApp">
<h1>✅ RGS JALLAHJEEM - Fee System</h1>
<p>Login ho gaya! Ab Fee System chal raha hai. B-Form feature ready hai.</p>
<div style="margin:15px 0">
<input id="sName" class="input" placeholder="Student Name" style="width:180px;display:inline-block">
<input id="sClass" class="input" placeholder="Class" style="width:100px;display:inline-block">
<input id="sBform" class="input" placeholder="B-Form Number" style="width:200px;display:inline-block">
<button class="btn-gold" style="width:auto;padding:10px 15px" onclick="addStudent()">Add</button>
<button style="background:#fff" onclick="localStorage.removeItem('rgs_auth');location.reload()">Logout</button>
</div>
<table><thead><tr><th>Name</th><th>Class</th><th>B-Form 🆔</th><th>Fee</th><th>Delete</th></tr></thead><tbody id="tbody"></tbody></table>
</div>

<script>
const USER="RGSJALLAHJEEM"; const PASS="RGJ123";
let students = JSON.parse(localStorage.getItem('rgs_students')||'[]');
function doLogin(){
  let u=document.getElementById('userInput').value.trim();
  let p=document.getElementById('passInput').value.trim();
  if(u.toUpperCase()===USER && p.toUpperCase()===PASS){
    localStorage.setItem('rgs_auth','true');
    showApp();
  }else{
    let e=document.getElementById('errMsg');
    e.style.display='block';
    e.innerText='Invalid! Sahi hai: RGSJALLAHJEEM / RGJ123';
  }
}
function showApp(){
  document.getElementById('loginPage').style.display='none';
  document.getElementById('mainApp').style.display='block';
  document.body.style.alignItems='flex-start';
  render();
}
function checkAuth(){ if(localStorage.getItem('rgs_auth')==='true') showApp(); }
document.getElementById('loginBtn').addEventListener('click',doLogin);
document.getElementById('passInput').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});
document.getElementById('userInput').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});
function addStudent(){
  let n=document.getElementById('sName').value;
  let c=document.getElementById('sClass').value;
  let b=document.getElementById('sBform').value;
  if(!n) return alert('Name likhen');
  students.push({name:n,class:c,bform:b,fee:'Pending'});
  localStorage.setItem('rgs_students',JSON.stringify(students));
  render();
}
function render(){
  let tb=document.getElementById('tbody'); tb.innerHTML='';
  students.forEach((s,i)=>{
    tb.innerHTML+=`<tr><td>${s.name}</td><td>${s.class}</td><td><span class="bform">🆔 ${s.bform||'No B-Form'}</span></td><td>${s.fee}</td><td><button onclick="students.splice(${i},1);localStorage.setItem('rgs_students',JSON.stringify(students));render()">Del</button></td></tr>`;
  });
}
checkAuth();
</script>
</body>
</html
